openapi: 3.0.0
info:
  title: Comprehensive API Management System
  description: A complete API system for managing products, users, roles, and permissions with JWT authentication, image uploads, and advanced filtering capabilities
  version: 1.0.0
  contact:
    name: API Support
    email: support@example.com
    url: https://example.com/support
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: http://localhost:8000/api
    description: Development server
  - url: https://api.example.com/api
    description: Production server

tags:
  - name: Authentication
    description: User authentication and authorization operations
  - name: Users
    description: User management operations
  - name: Roles
    description: Role management operations
  - name: Products
    description: Product management operations

paths:
  # Authentication Endpoints
  /register:
    post:
      summary: Register a new user
      description: Create a new user account with default Viewer role
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRegister'
      responses:
        '201':
          description: User registered successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: User registered successfully
                  user:
                    $ref: '#/components/schemas/User'
                  token:
                    type: string
                    example: eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9...
                  roles:
                    type: string
                    example: Viewer
                  permissions:
                    type: array
                    items:
                      type: string
                    example: ["products.view"]
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'

  /login:
    post:
      summary: User login
      description: Authenticate user and return JWT token
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserLogin'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Login successful
                  user:
                    $ref: '#/components/schemas/User'
                  token:
                    type: string
                    example: eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9...
                  roles:
                    type: string
                    example: admin,manager
                  permissions:
                    type: array
                    items:
                      type: string
                    example: ["users.view", "users.create", "products.view"]
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Invalid credentials

  /user:
    get:
      summary: Get current user
      description: Retrieve current authenticated user information
      tags: [Authentication]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: User information retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: '#/components/schemas/User'
                  token:
                    type: string
                    example: eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9...
                  roles:
                    type: string
                    example: admin,manager
                  permissions:
                    type: array
                    items:
                      type: string
                    example: ["users.view", "users.create"]
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedError'

  /logout:
    post:
      summary: User logout
      description: Invalidate current JWT token
      tags: [Authentication]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Logout successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Successfully logged out

  /refresh:
    post:
      summary: Refresh JWT token
      description: Get a new JWT token using current token
      tags: [Authentication]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Token refreshed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                    example: eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9...

  # User Management Endpoints
  /users:
    get:
      summary: Get list of users
      description: Retrieve a paginated list of users with filtering, searching, and sorting options
      tags: [Users]
      security:
        - bearerAuth: []
      parameters:
        - name: search
          in: query
          description: Search in name or email
          required: false
          schema:
            type: string
            example: john
        - name: role
          in: query
          description: Filter by role name
          required: false
          schema:
            type: string
            example: admin
        - name: sort_by
          in: query
          description: Sort field
          required: false
          schema:
            type: string
            enum: [name, email, created_at, updated_at]
            example: created_at
        - name: sort_order
          in: query
          description: Sort order
          required: false
          schema:
            type: string
            enum: [asc, desc]
            example: desc
        - name: per_page
          in: query
          description: Number of items per page
          required: false
          schema:
            type: integer
            example: 10
        - name: with_roles
          in: query
          description: Include user roles in response
          required: false
          schema:
            type: boolean
            example: true
      responses:
        '200':
          description: Users retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: Users fetched successfully
                  data:
                    type: object
                    properties:
                      users:
                        type: array
                        items:
                          $ref: '#/components/schemas/User'
                      current_page:
                        type: integer
                        example: 1
                      last_page:
                        type: integer
                        example: 5
                      per_page:
                        type: integer
                        example: 10
                      total:
                        type: integer
                        example: 50
                      next_page_url:
                        type: string
                        nullable: true
                      prev_page_url:
                        type: string
                        nullable: true
        '403':
          description: Unauthorized access
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedError'

    post:
      summary: Create a new user
      description: Create a new user with optional role assignments
      tags: [Users]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreate'
      responses:
        '200':
          description: User created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: User created successfully
                  data:
                    $ref: '#/components/schemas/User'
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '403':
          description: Unauthorized access
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedError'

  /users/{id}:
    get:
      summary: Get a specific user
      description: Retrieve details of a specific user by ID
      tags: [Users]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          description: User ID
          required: true
          schema:
            type: integer
            example: 1
        - name: with_roles
          in: query
          description: Include user roles in response
          required: false
          schema:
            type: boolean
            example: true
      responses:
        '200':
          description: User retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: User fetched successfully
                  data:
                    $ref: '#/components/schemas/User'
        '403':
          description: Unauthorized access
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedError'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'

    put:
      summary: Update a user
      description: Update an existing user with optional role assignments
      tags: [Users]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          description: User ID
          required: true
          schema:
            type: integer
            example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdate'
      responses:
        '200':
          description: User updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: User updated successfully
                  data:
                    $ref: '#/components/schemas/User'
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '403':
          description: Unauthorized access
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedError'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'

    delete:
      summary: Delete a user
      description: Delete a user (users cannot delete themselves)
      tags: [Users]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          description: User ID
          required: true
          schema:
            type: integer
            example: 1
      responses:
        '200':
          description: User deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: User deleted successfully
        '403':
          description: Unauthorized access
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedError'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'

  /users/{id}/assign-roles:
    post:
      summary: Assign roles to a user
      description: Assign additional roles to a user
      tags: [Users]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          description: User ID
          required: true
          schema:
            type: integer
            example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [roles]
              properties:
                roles:
                  type: array
                  items:
                    type: integer
                  example: [1, 2]
      responses:
        '200':
          description: Roles assigned successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: Roles assigned successfully
                  data:
                    $ref: '#/components/schemas/User'

  /users/{id}/remove-roles:
    delete:
      summary: Remove roles from a user
      description: Remove specific roles from a user
      tags: [Users]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          description: User ID
          required: true
          schema:
            type: integer
            example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [roles]
              properties:
                roles:
                  type: array
                  items:
                    type: integer
                  example: [1, 2]
      responses:
        '200':
          description: Roles removed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: Roles removed successfully
                  data:
                    $ref: '#/components/schemas/User'

  # Role Management Endpoints
  /roles:
    get:
      summary: Get list of roles
      description: Retrieve a paginated list of roles with filtering, searching, and sorting options
      tags: [Roles]
      security:
        - bearerAuth: []
      parameters:
        - name: search
          in: query
          description: Search in name or display_name
          required: false
          schema:
            type: string
            example: admin
        - name: sort_by
          in: query
          description: Sort field
          required: false
          schema:
            type: string
            enum: [name, display_name, created_at, updated_at]
            example: created_at
        - name: sort_order
          in: query
          description: Sort order
          required: false
          schema:
            type: string
            enum: [asc, desc]
            example: desc
        - name: per_page
          in: query
          description: Number of items per page
          required: false
          schema:
            type: integer
            example: 10
        - name: with_permissions
          in: query
          description: Include role permissions in response
          required: false
          schema:
            type: boolean
            example: true
      responses:
        '200':
          description: Roles retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: Roles fetched successfully
                  data:
                    type: object
                    properties:
                      roles:
                        type: array
                        items:
                          $ref: '#/components/schemas/Role'
                      current_page:
                        type: integer
                        example: 1
                      last_page:
                        type: integer
                        example: 5
                      per_page:
                        type: integer
                        example: 10
                      total:
                        type: integer
                        example: 50
                      next_page_url:
                        type: string
                        nullable: true
                      prev_page_url:
                        type: string
                        nullable: true
        '403':
          description: Unauthorized access
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedError'

    post:
      summary: Create a new role
      description: Create a new role with optional permission assignments
      tags: [Roles]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleCreate'
      responses:
        '200':
          description: Role created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: Role created successfully
                  data:
                    $ref: '#/components/schemas/Role'
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '403':
          description: Unauthorized access
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedError'

  /roles/{id}:
    get:
      summary: Get a specific role
      description: Retrieve details of a specific role by ID
      tags: [Roles]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          description: Role ID
          required: true
          schema:
            type: integer
            example: 1
        - name: with_permissions
          in: query
          description: Include role permissions in response
          required: false
          schema:
            type: boolean
            example: true
      responses:
        '200':
          description: Role retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: Role fetched successfully
                  data:
                    $ref: '#/components/schemas/Role'
        '403':
          description: Unauthorized access
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedError'
        '404':
          description: Role not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'

    put:
      summary: Update a role
      description: Update an existing role with optional permission assignments
      tags: [Roles]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          description: Role ID
          required: true
          schema:
            type: integer
            example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleUpdate'
      responses:
        '200':
          description: Role updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: Role updated successfully
                  data:
                    $ref: '#/components/schemas/Role'
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '403':
          description: Unauthorized access
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedError'
        '404':
          description: Role not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'

    delete:
      summary: Delete a role
      description: Delete a role and remove all permission assignments
      tags: [Roles]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          description: Role ID
          required: true
          schema:
            type: integer
            example: 1
      responses:
        '200':
          description: Role deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: Role deleted successfully
        '403':
          description: Unauthorized access
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedError'
        '404':
          description: Role not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'

  /roles/{id}/attach-permissions:
    post:
      summary: Attach permissions to a role
      description: Attach additional permissions to a role without removing existing ones
      tags: [Roles]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          description: Role ID
          required: true
          schema:
            type: integer
            example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [permissions]
              properties:
                permissions:
                  type: array
                  items:
                    type: integer
                  example: [1, 2, 3]
      responses:
        '200':
          description: Permissions attached successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: Permissions attached successfully
                  data:
                    $ref: '#/components/schemas/Role'

  /roles/{id}/detach-permissions:
    delete:
      summary: Detach permissions from a role
      description: Remove specific permissions from a role
      tags: [Roles]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          description: Role ID
          required: true
          schema:
            type: integer
            example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [permissions]
              properties:
                permissions:
                  type: array
                  items:
                    type: integer
                  example: [1, 2, 3]
      responses:
        '200':
          description: Permissions detached successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: Permissions detached successfully
                  data:
                    $ref: '#/components/schemas/Role'

paths:
  /products:
    get:
      summary: Get list of products
      description: Retrieve a paginated list of products with filtering, searching, and sorting options
      tags: [Products]
      security:
        - bearerAuth: []
      parameters:
        - name: category
          in: query
          description: Filter by product category
          required: false
          schema:
            type: string
            example: Electronics
        - name: brand
          in: query
          description: Filter by product brand
          required: false
          schema:
            type: string
            example: Apple
        - name: min_price
          in: query
          description: Minimum price filter
          required: false
          schema:
            type: number
            format: float
            example: 10.00
        - name: max_price
          in: query
          description: Maximum price filter
          required: false
          schema:
            type: number
            format: float
            example: 1000.00
        - name: in_stock
          in: query
          description: Filter by stock availability
          required: false
          schema:
            type: string
            enum: [true, false]
            example: true
        - name: is_active
          in: query
          description: Filter by active status
          required: false
          schema:
            type: boolean
            example: true
        - name: search
          in: query
          description: Search in name, description, or SKU
          required: false
          schema:
            type: string
            example: iPhone
        - name: sort_by
          in: query
          description: Sort field
          required: false
          schema:
            type: string
            enum: [name, price, created_at, updated_at]
            example: created_at
        - name: sort_order
          in: query
          description: Sort order
          required: false
          schema:
            type: string
            enum: [asc, desc]
            example: desc
        - name: per_page
          in: query
          description: Number of items per page
          required: false
          schema:
            type: integer
            example: 10
      responses:
        '200':
          description: Products retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: Products fetched successfully
                  data:
                    type: object
                    properties:
                      products:
                        type: array
                        items:
                          $ref: '#/components/schemas/Product'
                      current_page:
                        type: integer
                        example: 1
                      last_page:
                        type: integer
                        example: 5
                      per_page:
                        type: integer
                        example: 10
                      total:
                        type: integer
                        example: 50
                      next_page_url:
                        type: string
                        nullable: true
                      prev_page_url:
                        type: string
                        nullable: true
                      filters_applied:
                        type: object
        '403':
          description: Unauthorized access
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedError'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerError'

    post:
      summary: Create a new product
      description: Create a new product with optional image upload
      tags: [Products]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ProductCreate'
      responses:
        '200':
          description: Product created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: Product created successfully
                  data:
                    $ref: '#/components/schemas/Product'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '403':
          description: Unauthorized access
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedError'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerError'

  /products/{id}:
    get:
      summary: Get a specific product
      description: Retrieve details of a specific product by ID
      tags: [Products]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          description: Product ID
          required: true
          schema:
            type: integer
            example: 1
      responses:
        '200':
          description: Product retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: Product fetched successfully
                  data:
                    $ref: '#/components/schemas/Product'
        '403':
          description: Unauthorized access
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedError'
        '404':
          description: Product not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'

    put:
      summary: Update a product
      description: Update an existing product with optional image replacement
      tags: [Products]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          description: Product ID
          required: true
          schema:
            type: integer
            example: 1
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ProductUpdate'
      responses:
        '200':
          description: Product updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: Product updated successfully
                  data:
                    $ref: '#/components/schemas/Product'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '403':
          description: Unauthorized access
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedError'
        '404':
          description: Product not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerError'

    delete:
      summary: Delete a product
      description: Delete a product and its associated image file
      tags: [Products]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          description: Product ID
          required: true
          schema:
            type: integer
            example: 1
      responses:
        '200':
          description: Product deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: Product deleted successfully
        '403':
          description: Unauthorized access
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedError'
        '404':
          description: Product not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerError'

  /products/categories:
    get:
      summary: Get available categories
      description: Retrieve a list of all available product categories
      tags: [Products]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Categories retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      type: string
                      example: Electronics

  /products/brands:
    get:
      summary: Get available brands
      description: Retrieve a list of all available product brands
      tags: [Products]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Brands retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: Brands fetched successfully
                  data:
                    type: array
                    items:
                      type: string
                      example: Apple

components:
  schemas:
    # Authentication Schemas
    UserRegister:
      type: object
      required: [name, email, password]
      properties:
        name:
          type: string
          maxLength: 255
          example: John Doe
          description: User full name
        email:
          type: string
          maxLength: 255
          example: john@example.com
          description: User email address
        password:
          type: string
          minLength: 8
          example: password123
          description: User password

    UserLogin:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          maxLength: 255
          example: john@example.com
          description: User email address
        password:
          type: string
          example: password123
          description: User password

    # User Schemas
    User:
      type: object
      required: [id, name, email, created_at, updated_at]
      properties:
        id:
          type: integer
          example: 1
          description: Unique user identifier
        name:
          type: string
          maxLength: 255
          example: John Doe
          description: User full name
        email:
          type: string
          maxLength: 255
          example: john@example.com
          description: User email address
        email_verified_at:
          type: string
          format: date-time
          nullable: true
          example: 2024-01-15T10:30:00.000000Z
          description: Email verification timestamp
        created_at:
          type: string
          format: date-time
          example: 2024-01-15T10:30:00.000000Z
          description: User creation timestamp
        updated_at:
          type: string
          format: date-time
          example: 2024-01-15T10:30:00.000000Z
          description: User last update timestamp
        roles:
          type: array
          items:
            $ref: '#/components/schemas/Role'
          description: User roles
        permissions:
          type: array
          items:
            $ref: '#/components/schemas/Permission'
          description: User permissions

    UserCreate:
      type: object
      required: [name, email, password]
      properties:
        name:
          type: string
          maxLength: 255
          example: John Doe
          description: User full name
        email:
          type: string
          maxLength: 255
          example: john@example.com
          description: User email address
        password:
          type: string
          minLength: 8
          example: password123
          description: User password
        password_confirmation:
          type: string
          example: password123
          description: Password confirmation
        roles:
          type: array
          items:
            type: integer
          example: [1, 2]
          description: Role IDs to assign

    UserUpdate:
      type: object
      required: [name, email]
      properties:
        name:
          type: string
          maxLength: 255
          example: John Smith
          description: User full name
        email:
          type: string
          maxLength: 255
          example: johnsmith@example.com
          description: User email address
        password:
          type: string
          minLength: 8
          example: newpassword123
          description: New password (optional)
        password_confirmation:
          type: string
          example: newpassword123
          description: Password confirmation
        roles:
          type: array
          items:
            type: integer
          example: [1, 3]
          description: Role IDs to assign

    # Role Schemas
    Role:
      type: object
      required: [id, name, created_at, updated_at]
      properties:
        id:
          type: integer
          example: 1
          description: Unique role identifier
        name:
          type: string
          maxLength: 255
          example: admin
          description: Role name
        display_name:
          type: string
          maxLength: 255
          nullable: true
          example: Administrator
          description: Role display name
        description:
          type: string
          maxLength: 1000
          nullable: true
          example: Administrator role with full access
          description: Role description
        created_at:
          type: string
          format: date-time
          example: 2024-01-15T10:30:00.000000Z
          description: Role creation timestamp
        updated_at:
          type: string
          format: date-time
          example: 2024-01-15T10:30:00.000000Z
          description: Role last update timestamp
        permissions:
          type: array
          items:
            $ref: '#/components/schemas/Permission'
          description: Role permissions
        users_count:
          type: integer
          example: 5
          description: Number of users with this role
        permissions_count:
          type: integer
          example: 10
          description: Number of permissions assigned to this role

    RoleCreate:
      type: object
      required: [name]
      properties:
        name:
          type: string
          maxLength: 255
          example: manager
          description: Role name
        display_name:
          type: string
          maxLength: 255
          nullable: true
          example: Manager
          description: Role display name
        description:
          type: string
          maxLength: 1000
          nullable: true
          example: Manager role with limited access
          description: Role description
        permissions:
          type: array
          items:
            type: integer
          example: [1, 2, 3]
          description: Permission IDs to assign

    RoleUpdate:
      type: object
      required: [name]
      properties:
        name:
          type: string
          maxLength: 255
          example: senior_manager
          description: Role name
        display_name:
          type: string
          maxLength: 255
          nullable: true
          example: Senior Manager
          description: Role display name
        description:
          type: string
          maxLength: 1000
          nullable: true
          example: Senior manager role with extended access
          description: Role description
        permissions:
          type: array
          items:
            type: integer
          example: [1, 2, 4, 5]
          description: Permission IDs to assign

    # Permission Schema
    Permission:
      type: object
      required: [id, name]
      properties:
        id:
          type: integer
          example: 1
          description: Unique permission identifier
        name:
          type: string
          maxLength: 255
          example: users.view
          description: Permission name
        display_name:
          type: string
          maxLength: 255
          nullable: true
          example: View Users
          description: Permission display name
        description:
          type: string
          maxLength: 1000
          nullable: true
          example: Permission to view user information
          description: Permission description

    # Product Schemas
    Product:
      type: object
      required: [id, name, price, stock, is_active, created_at, updated_at]
      properties:
        id:
          type: integer
          example: 1
          description: Unique product identifier
        name:
          type: string
          maxLength: 255
          example: iPhone 15 Pro
          description: Product name
        description:
          type: string
          maxLength: 1000
          nullable: true
          example: Latest iPhone with advanced features
          description: Product description
        price:
          type: number
          format: float
          minimum: 0
          maximum: 999999.99
          example: 999.99
          description: Product price
        stock:
          type: integer
          minimum: 0
          maximum: 999999
          example: 100
          description: Available stock quantity
        sku:
          type: string
          maxLength: 50
          nullable: true
          example: IPH15PRO-001
          description: Stock Keeping Unit
        image:
          type: string
          nullable: true
          example: products/1234567890_abc123.jpg
          description: Product image file path
        category:
          type: string
          maxLength: 100
          nullable: true
          example: Electronics
          description: Product category
        brand:
          type: string
          maxLength: 100
          nullable: true
          example: Apple
          description: Product brand
        is_active:
          type: boolean
          example: true
          description: Product active status
        created_at:
          type: string
          format: date-time
          example: 2024-01-15T10:30:00.000000Z
          description: Product creation timestamp
        updated_at:
          type: string
          format: date-time
          example: 2024-01-15T10:30:00.000000Z
          description: Product last update timestamp

    ProductCreate:
      type: object
      required: [name, price, stock]
      properties:
        name:
          type: string
          maxLength: 255
          example: iPhone 15 Pro
          description: Product name
        description:
          type: string
          maxLength: 1000
          nullable: true
          example: Latest iPhone with advanced features
          description: Product description
        price:
          type: number
          format: float
          minimum: 0
          maximum: 999999.99
          example: 999.99
          description: Product price
        stock:
          type: integer
          minimum: 0
          maximum: 999999
          example: 100
          description: Available stock quantity
        sku:
          type: string
          maxLength: 50
          nullable: true
          example: IPH15PRO-001
          description: Stock Keeping Unit (must be unique)
        image:
          type: string
          format: binary
          description: Product image file (jpeg, png, jpg, gif, svg, max 2MB)
        category:
          type: string
          maxLength: 100
          nullable: true
          example: Electronics
          description: Product category
        brand:
          type: string
          maxLength: 100
          nullable: true
          example: Apple
          description: Product brand
        is_active:
          type: boolean
          example: true
          description: Product active status

    ProductUpdate:
      type: object
      required: [name, price, stock]
      properties:
        name:
          type: string
          maxLength: 255
          example: iPhone 15 Pro Max
          description: Product name
        description:
          type: string
          maxLength: 1000
          nullable: true
          example: Updated description
          description: Product description
        price:
          type: number
          format: float
          minimum: 0
          maximum: 999999.99
          example: 1099.99
          description: Product price
        stock:
          type: integer
          minimum: 0
          maximum: 999999
          example: 50
          description: Available stock quantity
        sku:
          type: string
          maxLength: 50
          nullable: true
          example: IPH15PROMAX-001
          description: Stock Keeping Unit (must be unique)
        image:
          type: string
          format: binary
          description: New product image file (jpeg, png, jpg, gif, svg, max 2MB)
        category:
          type: string
          maxLength: 100
          nullable: true
          example: Electronics
          description: Product category
        brand:
          type: string
          maxLength: 100
          nullable: true
          example: Apple
          description: Product brand
        is_active:
          type: boolean
          example: true
          description: Product active status

    ValidationError:
      type: object
      properties:
        code:
          type: integer
          example: 422
          description: Validation error code
        status:
          type: string
          example: error
          description: Error status
        message:
          type: string
          example: Validation failed
          description: Error message
        errors:
          type: object
          description: Field-specific validation errors
          additionalProperties:
            type: array
            items:
              type: string

    UnauthorizedError:
      type: object
      properties:
        code:
          type: integer
          example: 403
          description: Unauthorized error code
        status:
          type: string
          example: error
          description: Error status
        message:
          type: string
          example: You are not authorized to perform this action
          description: Error message

    NotFoundError:
      type: object
      properties:
        code:
          type: integer
          example: 404
          description: Not found error code
        status:
          type: string
          example: error
          description: Error status
        message:
          type: string
          example: Resource not found
          description: Error message

    ServerError:
      type: object
      properties:
        code:
          type: integer
          example: 500
          description: Server error code
        status:
          type: string
          example: error
          description: Error status
        message:
          type: string
          example: Internal server error
          description: Error message
        errors:
          type: array
          items:
            type: string
          description: Error details

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Enter JWT token in the format Bearer {token}
